apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: phishing-detector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: phishingdetectoracr.azurecr.io/phishing-website-detector-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_URI
              value: mongodb://mongodb:27017/phishing_detector
            - name: SECRET_KEY
              value: change-this-local-secret