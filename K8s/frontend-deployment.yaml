apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: phishing-detector

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:

      - name: frontend

        image: phishingdetectoracr.azurecr.io/phishing-website-detector-frontend:latest

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "250m"
            memory: "256Mi"